services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: data_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d data_platform"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pipeline:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_PLATFORM_DATABASE_URL: postgresql://platform:platform@postgres:5432/data_platform
    command: ["--input", "data/sample_orders.csv"]

volumes:
  postgres_data:

