name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: data_platform_test
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d data_platform_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev,spark]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          TEST_POSTGRES_URL: postgresql://platform:platform@localhost:5432/data_platform_test
        run: pytest
